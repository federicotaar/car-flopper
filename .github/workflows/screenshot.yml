name: Simulator screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install xtool
        run: |
          set -e
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip && break
            sleep 5
          done
          ditto -x -k /tmp/xtool.app.zip /tmp/xtool
          echo "/tmp/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Generate app icon
        run: |
          set -e
          mkdir -p Resources
          base64 -D -i assets/icon.b64 -o Resources/icon1024.png
          sips -z 120 120 Resources/icon1024.png --out "Resources/AppIcon60x60@2x.png"
          sips -z 180 180 Resources/icon1024.png --out "Resources/AppIcon60x60@3x.png"

      - name: Boot an iPhone simulator
        run: |
          set -e
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          echo "Using runtime: $RUNTIME"
          DEV=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone 1[5-9]|iPhone [2-9]"))] | first | .identifier')
          echo "Using device type: $DEV"
          xcrun simctl create cf-shot "$DEV" "$RUNTIME"
          xcrun simctl boot cf-shot
          xcrun simctl bootstatus cf-shot -b

      - name: Build for simulator
        run: |
          set -e
          xtool dev build --triple arm64-apple-ios-simulator -c release
          echo "---- build output ----"
          find . -name "*.app" -maxdepth 4

      - name: Install and launch
        run: |
          set -e
          APP=$(find . -name "*.app" -maxdepth 4 | head -n1)
          echo "App bundle: $APP"
          xcrun simctl install cf-shot "$APP"
          xcrun simctl spawn cf-shot defaults write federicotaranu.carflopper carflopper.nick -string SIMHOST || true
          xcrun simctl launch cf-shot federicotaranu.carflopper || true
          sleep 10
          mkdir -p shots
          xcrun simctl io cf-shot screenshot shots/01-menu.png

      - name: Install idb
        run: |
          python3 -m pip install --user --quiet fb-idb || python3 -m pip install --user --break-system-packages --quiet fb-idb
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          idb --version || true

      - name: Drive create-room, lobby and garage
        run: |
          set -e
          UDID=$(xcrun simctl list devices -j | jq -r '.devices[][] | select(.name=="cf-shot") | .udid' | head -1)
          echo "UDID: $UDID"
          echo '' | base64 -D > /tmp/tapfind.py
          tap_label() {
            idb ui describe-all --udid "$UDID" | python3 /tmp/tapfind.py "$1" > /tmp/tap.txt
            cat /tmp/tap.txt
          }
          echo "== menu elements (first 1500 chars) =="
          idb ui describe-all --udid "$UDID" | head -c 1500 || true
          XY=$(tap_label "create garage")
          echo "tapping CREATE GARAGE at $XY"
          idb ui tap $XY --udid "$UDID"
          sleep 6
          xcrun simctl io cf-shot screenshot shots/02-lobby.png
          idb ui describe-all --udid "$UDID" | head -c 1500 || true
          XY=$(tap_label "start fixing")
          echo "tapping START FIXING at $XY"
          idb ui tap $XY --udid "$UDID"
          sleep 12
          xcrun simctl io cf-shot screenshot shots/03-garage.png
          echo "== walk test: drag joystick =="
          idb ui swipe 150 500 150 380 --udid "$UDID" --duration 1.2 || true
          sleep 3
          xcrun simctl io cf-shot screenshot shots/04-walk.png
          idb ui swipe 150 500 240 480 --udid "$UDID" --duration 1.2 || true
          sleep 3
          xcrun simctl io cf-shot screenshot shots/05-walk2.png

      - name: App log tail
        if: always()
        run: |
          xcrun simctl spawn cf-shot log show --last 3m --predicate 'processImagePath CONTAINS "CarFlopper"' --style compact | tail -40 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: shots/*.png

      - name: Attach screenshots to prerelease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="v$(/usr/libexec/PlistBuddy -c 'Print :CarFlopperReleaseLabel' CarFlopper-Info.plist)"
          if ! gh release view "$REL" >/dev/null 2>&1; then
            gh release create "$REL" --prerelease --title "$REL (PRERELEASE - unverified build)" --notes "Automated prerelease - screenshots pending verification. Not a verified build."
          fi
          for f in shots/*.png; do
            gh release upload "$REL" "$f" --clobber
          done
