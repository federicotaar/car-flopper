name: Simulator screenshots

on:
  workflow_dispatch:
    inputs:
      autodrive_debug:
        description: 'Autodrive on-screen debug overlay (kept out of preview captures)'
        required: false
        type: boolean
        default: false
      mode:
        description: 'showcase (orbit captures), repair (repair-motion video + burst frames) or touch (idb HID touch harness)'
        required: true
        type: choice
        options: [showcase, repair, touch]
        default: showcase
      stress_cuff:
        description: 'Add the artificial +/-35deg wrist sweep (stress only, not gameplay)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: simshots
  cancel-in-progress: false

jobs:
  shots:
    if: inputs.mode != 'touch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install xtool
        run: |
          set -e
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip && break
            sleep 5
          done
          ditto -x -k /tmp/xtool.app.zip /tmp/xtool
          echo "/tmp/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Generate app icon
        run: |
          set -e
          mkdir -p Resources
          base64 -D -i assets/icon.b64 -o Resources/icon1024.png
          sips -z 120 120 Resources/icon1024.png --out "Resources/AppIcon60x60@2x.png"
          sips -z 180 180 Resources/icon1024.png --out "Resources/AppIcon60x60@3x.png"

      - name: Boot an iPhone simulator
        run: |
          set -e
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          echo "Using runtime: $RUNTIME"
          DEV=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone 1[5-9]|iPhone [2-9]"))] | first | .identifier')
          echo "Using device type: $DEV"
          xcrun simctl create cf-shot "$DEV" "$RUNTIME"
          xcrun simctl boot cf-shot
          xcrun simctl bootstatus cf-shot -b

      - name: Enable autodrive hooks for the sim build only
        run: |
          sed -i '' 's/#if AUTODRIVE/#if true/' Sources/CarFlopper/MenuViews.swift Sources/CarFlopper/GameView.swift
          sed -i '' 's|//ADLOG ||' Sources/CarFlopper/HandRig.swift Sources/CarFlopper/GameScene.swift
          grep -c '#if true' Sources/CarFlopper/MenuViews.swift Sources/CarFlopper/GameView.swift
          grep -c CFHAND Sources/CarFlopper/HandRig.swift Sources/CarFlopper/GameScene.swift

      - name: Build for simulator
        run: |
          set -e
          xtool dev build --triple arm64-apple-ios-simulator -c release
          echo "---- build output ----"
          find . -name "*.app" -maxdepth 4

      - name: Install and launch
        run: |
          set -e
          APP=$(find . -name "*.app" -maxdepth 4 | head -n1)
          echo "App bundle: $APP"
          xcrun simctl install cf-shot "$APP"
          xcrun simctl spawn cf-shot defaults write federicotaranu.carflopper carflopper.nick -string SIMHOST || true
          ARGS="-CFAutoDrive"
          if [ "${{ inputs.autodrive_debug }}" = "true" ]; then ARGS="$ARGS -CFAutoDriveDebug"; fi
          if [ "${{ inputs.mode }}" = "repair" ]; then ARGS="$ARGS -CFAutoDriveRepair"; fi
          if [ "${{ inputs.stress_cuff }}" = "true" ]; then ARGS="$ARGS -CFStressCuff"; fi
          xcrun simctl launch cf-shot federicotaranu.carflopper $ARGS || true
          mkdir -p shots
          sleep 4
          xcrun simctl io cf-shot screenshot shots/01-menu.png

      - name: Capture auto-drive lobby, garage, walk and parks
        if: inputs.mode != 'repair'
        run: |
          set -e
          nohup xcrun simctl spawn cf-shot log stream --level debug --predicate 'process == "CarFlopper"' --style compact > /tmp/cflog.txt 2>&1 &
          sleep 9
          xcrun simctl io cf-shot screenshot shots/02-orbit.png
          sleep 12
          xcrun simctl io cf-shot screenshot shots/03-orbit2.png
          sleep 12
          xcrun simctl io cf-shot screenshot shots/04-parkFL.png
          sleep 12
          xcrun simctl io cf-shot screenshot shots/05-parkFL2.png
          sleep 13
          xcrun simctl io cf-shot screenshot shots/06-parkFR.png
          sleep 14
          xcrun simctl io cf-shot screenshot shots/07-parkFR2.png
          sleep 16
          xcrun simctl io cf-shot screenshot shots/08-rear.png
          sleep 15
          xcrun simctl io cf-shot screenshot shots/09-bay.png
          sleep 15
          xcrun simctl io cf-shot screenshot shots/10-bay2.png
          sleep 15
          xcrun simctl io cf-shot screenshot shots/11-wheelface.png
          sleep 15
          xcrun simctl io cf-shot screenshot shots/12-side.png
          sleep 15
          xcrun simctl io cf-shot screenshot shots/13-side2.png

      - name: Capture repair motion (video + burst frames)
        if: inputs.mode == 'repair'
        run: |
          set -e
          nohup xcrun simctl spawn cf-shot log stream --level debug --predicate 'process == "CarFlopper"' --style compact > /tmp/cflog.txt 2>&1 &
          # video covers: garage appear, equip reach at the diagnostics cart,
          # 12s engine hold, wrench equip reach, 7s wheel hold, plus margin
          xcrun simctl io cf-shot recordVideo shots/repair-motion.mp4 &
          VIDPID=$!
          for i in $(seq 1 21); do
            sleep 5
            xcrun simctl io cf-shot screenshot "shots/repair-$(printf %02d $i).png" || true
          done
          kill -INT $VIDPID || true
          sleep 3
          ls -la shots/

      - name: App log tail
        if: always()
        run: |
          echo '--- log stream CFAUTODRIVE ---'
          grep CFAUTODRIVE /tmp/cflog.txt | tail -80 || true
          echo '--- log stream CFREPAIR ---'
          grep CFREPAIR /tmp/cflog.txt | tail -80 || true
          echo '--- log stream all ---'
          tail -40 /tmp/cflog.txt || true
          echo '--- log show fallback ---'
          xcrun simctl spawn cf-shot log show --last 4m --predicate 'process == "CarFlopper"' --style compact | tail -40 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: |
            shots/*.png
            shots/*.mp4
            /tmp/cflog.txt

# re-registration touch after rename repair (no functional change)

  touch:
    if: inputs.mode == 'touch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install xtool
        run: |
          set -e
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip && break
            sleep 5
          done
          ditto -x -k /tmp/xtool.app.zip /tmp/xtool
          echo "/tmp/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Generate app icon
        run: |
          set -e
          mkdir -p Resources
          base64 -D -i assets/icon.b64 -o Resources/icon1024.png
          sips -z 120 120 Resources/icon1024.png --out "Resources/AppIcon60x60@2x.png"
          sips -z 180 180 Resources/icon1024.png --out "Resources/AppIcon60x60@3x.png"

      - name: Boot an iPhone simulator
        run: |
          set -e
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          DEV=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone 1[5-9]|iPhone [2-9]"))] | first | .identifier')
          xcrun simctl create cf-touch "$DEV" "$RUNTIME"
          xcrun simctl boot cf-touch
          xcrun simctl bootstatus cf-touch -b

      - name: Enable autodrive hooks for the sim build only
        run: |
          sed -i '' 's/#if AUTODRIVE/#if true/' Sources/CarFlopper/MenuViews.swift Sources/CarFlopper/GameView.swift
          grep -c '#if true' Sources/CarFlopper/MenuViews.swift Sources/CarFlopper/GameView.swift

      - name: Build for simulator
        run: |
          set -e
          xtool dev build --triple arm64-apple-ios-simulator -c release
          find . -name "*.app" -maxdepth 4

      - name: Install idb (free, open source HID injector)
        run: |
          set +e
          mkdir -p /tmp/idbc && cd /tmp/idbc
          curl -sL -o c.tgz https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz
          tar xzf c.tgz 2>&1 | tail -2
          find /tmp/idbc -name idb_companion | head -3
          cd - >/dev/null
          python3 -m venv /tmp/idbvenv
          /tmp/idbvenv/bin/pip install fb-idb 2>&1 | tail -3
          find /tmp/idbc -name idb_companion | head -3; ls /tmp/idbvenv/bin | head -20
          /tmp/idbvenv/bin/idb --help 2>&1 | head -5
          exit 0

      - name: Install and launch in touch-test mode
        run: |
          set -e
          APP=$(find . -name "*.app" -maxdepth 4 | head -n1)
          xcrun simctl install cf-touch "$APP"
          xcrun simctl spawn cf-touch defaults write federicotaranu.carflopper carflopper.nick -string SIMTOUCH || true
          xcrun simctl launch cf-touch federicotaranu.carflopper -CFTouchTest || true

      - name: Wait for the garage and drive real HID touches
        run: |
          set +e
          export PATH=/tmp/idbvenv/bin:$PATH
          UDID=$(xcrun simctl list devices -j | jq -r '.devices[][] | select(.name=="cf-touch") | .udid')
          echo "udid $UDID"
          for i in $(seq 1 60); do
            xcrun simctl spawn cf-touch log show --last 2m --predicate 'processImagePath CONTAINS "CarFlopper"' --style compact > /tmp/probe.log 2>/dev/null
            grep -q 'CFTOUCH. probe armed' /tmp/probe.log && break
            sleep 3
          done
          grep -c 'CFTOUCH. state' /tmp/probe.log
          sleep 5
          mkdir -p out
          xcrun simctl io cf-touch screenshot out/00-before.png
          { echo "which: $(command -v idb_companion)"; ls /opt/homebrew/bin /usr/local/bin 2>/dev/null | grep -i idb; brew list idb-companion 2>&1 | head -5; } > out/diag.txt 2>&1
          CP=$(find /tmp/idbc -name idb_companion -type f | head -1); [ -z "$CP" ] && CP=$(command -v idb_companion || ls /opt/homebrew/bin/idb_companion /usr/local/bin/idb_companion 2>/dev/null | head -1)
          echo "companion: $CP" | tee -a out/diag.txt
          ($CP --udid "$UDID" --grpc-port 9999 > out/companion.log 2>&1 &)
          sleep 8
          export PATH="$(dirname "$CP"):$PATH"
          idb connect 127.0.0.1 9999 >> out/diag.txt 2>&1
          idb list-targets >> out/diag.txt 2>&1
          idb ui describe-all --udid "$UDID" --companion 127.0.0.1:9999 > out/ax.json 2> out/ax.err
          head -c 600 out/ax.json; echo; tail -3 out/ax.err
          head -c 1500 out/ax.json; echo; cat out/ax.err | head -5
          python3 - <<'PY'
          import json,subprocess,re,time,os
          env=os.environ
          UDID=subprocess.check_output("xcrun simctl list devices -j | jq -r '.devices[][] | select(.name==\"cf-touch\") | .udid'",shell=True,text=True).strip()
          def sh(c): return subprocess.run(c,shell=True,capture_output=True,text=True)
          def log():
              r=sh("xcrun simctl spawn cf-touch log show --last 40s --predicate 'processImagePath CONTAINS \"CarFlopper\"' --style compact")
              return r.stdout
          def state():
              ls=[l for l in log().splitlines() if 'CFTOUCH] state' in l]
              if not ls: return None
              m=re.search(r'pos=\(([-\d.]+),([-\d.]+)\) yaw=([-\d.]+)',ls[-1]); 
              return tuple(float(x) for x in m.groups()) if m else None
          def snap(n): sh(f"xcrun simctl io cf-touch screenshot out/{n}.png")
          def ax():
              try: return json.load(open('out/ax.json'))
              except Exception as e: return []
          def find(label):
              def walk(x):
                  if isinstance(x,list):
                      for i in x: yield from walk(i)
                  elif isinstance(x,dict):
                      if x.get('AXLabel')==label or x.get('AXUniqueId')==label: yield x
                      for v in x.values(): yield from walk(v)
              for e in walk(ax()): return e.get('frame')
          J=find('cf-joystick'); R=find('cf-repair')
          print('AX joystick',J,'repair',R)
          W,H=402,874
          maps={'M0':lambda x,y:(x,y),'M1':lambda x,y:(W-y,x),'M2':lambda x,y:(y,H-x)}
          # landscape fallbacks (874x402)
          jc=(153,241); rc=(739,301)
          if J: jc=(J['x']+J['width']/2,J['y']+J['height']/2)
          if R: rc=(R['x']+R['width']/2,R['y']+R['height']/2)
          print('centers',jc,rc)
          good=None
          for name,f in maps.items():
              s0=state(); x0,y0=f(*jc); x1,y1=f(jc[0]+40,jc[1])
              r=sh(f"idb ui swipe {x0:.0f} {y0:.0f} {x1:.0f} {y1:.0f} --duration 2 --udid {UDID} --companion 127.0.0.1:9999")
              print(name,'swipe',r.returncode,r.stderr[:120]); time.sleep(1)
              s1=state(); print(name,'state',s0,'->',s1)
              if s0 and s1 and (abs(s0[0]-s1[0])+abs(s0[1]-s1[1]))>0.05: good=name; snap('01-joystick-'+name); break
          print('JOY MAPPING',good)
          if good:
              f=maps[good]
              s0=state(); x0,y0=f(437,200); x1,y1=f(600,200)
              sh(f"idb ui swipe {x0:.0f} {y0:.0f} {x1:.0f} {y1:.0f} --duration 1 --udid {UDID} --companion 127.0.0.1:9999"); time.sleep(1)
              print('PAN yaw',s0,'->',state()); snap('02-pan')
              x,y=f(*rc)
              sh(f"idb ui tap {x:.0f} {y:.0f} --duration 2 --udid {UDID} --companion 127.0.0.1:9999"); time.sleep(1)
              snap('03-hold')
          full=log(); open('out/touch.log','w').write(full)
          print('\n'.join([l for l in full.splitlines() if 'CFTOUCH' in l and 'state' not in l][:60]))
          PY
          exit 0

      - name: Upload the touch harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touch-harness
          path: out
