name: Simulator screenshots

on:
  workflow_dispatch:
    inputs:
      autodrive_debug:
        description: 'Autodrive on-screen debug overlay (kept out of preview captures)'
        required: false
        type: boolean
        default: false
      mode:
        description: 'showcase (orbit captures) or repair (repair-motion video + burst frames)'
        required: true
        type: choice
        options: [showcase, repair]
        default: showcase

permissions:
  contents: write

concurrency:
  group: simshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install xtool
        run: |
          set -e
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip && break
            sleep 5
          done
          ditto -x -k /tmp/xtool.app.zip /tmp/xtool
          echo "/tmp/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Generate app icon
        run: |
          set -e
          mkdir -p Resources
          base64 -D -i assets/icon.b64 -o Resources/icon1024.png
          sips -z 120 120 Resources/icon1024.png --out "Resources/AppIcon60x60@2x.png"
          sips -z 180 180 Resources/icon1024.png --out "Resources/AppIcon60x60@3x.png"

      - name: Boot an iPhone simulator
        run: |
          set -e
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          echo "Using runtime: $RUNTIME"
          DEV=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone 1[5-9]|iPhone [2-9]"))] | first | .identifier')
          echo "Using device type: $DEV"
          xcrun simctl create cf-shot "$DEV" "$RUNTIME"
          xcrun simctl boot cf-shot
          xcrun simctl bootstatus cf-shot -b

      - name: Enable autodrive hooks for the sim build only
        run: |
          sed -i '' 's/#if AUTODRIVE/#if true/' Sources/CarFlopper/MenuViews.swift Sources/CarFlopper/GameView.swift
          grep -c '#if true' Sources/CarFlopper/MenuViews.swift Sources/CarFlopper/GameView.swift

      - name: Build for simulator
        run: |
          set -e
          xtool dev build --triple arm64-apple-ios-simulator -c release
          echo "---- build output ----"
          find . -name "*.app" -maxdepth 4

      - name: Install and launch
        run: |
          set -e
          APP=$(find . -name "*.app" -maxdepth 4 | head -n1)
          echo "App bundle: $APP"
          xcrun simctl install cf-shot "$APP"
          xcrun simctl spawn cf-shot defaults write federicotaranu.carflopper carflopper.nick -string SIMHOST || true
          ARGS="-CFAutoDrive"
          if [ "${{ inputs.autodrive_debug }}" = "true" ]; then ARGS="$ARGS -CFAutoDriveDebug"; fi
          if [ "${{ inputs.mode }}" = "repair" ]; then ARGS="$ARGS -CFAutoDriveRepair"; fi
          xcrun simctl launch cf-shot federicotaranu.carflopper $ARGS || true
          mkdir -p shots
          sleep 4
          xcrun simctl io cf-shot screenshot shots/01-menu.png

      - name: Capture auto-drive lobby, garage, walk and parks
        if: inputs.mode != 'repair'
        run: |
          set -e
          nohup xcrun simctl spawn cf-shot log stream --level debug --predicate 'process == "CarFlopper"' --style compact > /tmp/cflog.txt 2>&1 &
          sleep 9
          xcrun simctl io cf-shot screenshot shots/02-orbit.png
          sleep 12
          xcrun simctl io cf-shot screenshot shots/03-orbit2.png
          sleep 12
          xcrun simctl io cf-shot screenshot shots/04-parkFL.png
          sleep 12
          xcrun simctl io cf-shot screenshot shots/05-parkFL2.png
          sleep 13
          xcrun simctl io cf-shot screenshot shots/06-parkFR.png
          sleep 14
          xcrun simctl io cf-shot screenshot shots/07-parkFR2.png
          sleep 16
          xcrun simctl io cf-shot screenshot shots/08-rear.png
          sleep 17
          xcrun simctl io cf-shot screenshot shots/09-rear2.png
          sleep 20
          xcrun simctl io cf-shot screenshot shots/10-rear3.png
          sleep 20
          xcrun simctl io cf-shot screenshot shots/11-final.png

      - name: Capture repair motion (video + burst frames)
        if: inputs.mode == 'repair'
        run: |
          set -e
          nohup xcrun simctl spawn cf-shot log stream --level debug --predicate 'process == "CarFlopper"' --style compact > /tmp/cflog.txt 2>&1 &
          # video covers: garage appear, equip reach at the diagnostics cart,
          # 12s engine hold, wrench equip reach, 7s wheel hold, plus margin
          xcrun simctl io cf-shot recordVideo shots/repair-motion.mp4 &
          VIDPID=$!
          for i in $(seq 1 15); do
            sleep 5
            xcrun simctl io cf-shot screenshot "shots/repair-$(printf %02d $i).png" || true
          done
          kill -INT $VIDPID || true
          sleep 3
          ls -la shots/
        if: always()
        run: |
          echo '--- log stream CFAUTODRIVE ---'
          grep CFAUTODRIVE /tmp/cflog.txt | tail -80 || true
          echo '--- log stream all ---'
          tail -40 /tmp/cflog.txt || true
          echo '--- log show fallback ---'
          xcrun simctl spawn cf-shot log show --last 4m --predicate 'process == "CarFlopper"' --style compact | tail -40 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: |
            shots/*.png
            shots/*.mp4

# re-registration touch after rename repair (no functional change)
